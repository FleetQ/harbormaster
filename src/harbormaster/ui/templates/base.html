<!doctype html>
<html lang="en" class="bg-gray-950 text-gray-100">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Harbormaster{% endblock %}</title>
<meta name="description" content="Harbormaster — MCP server dashboard.">
{% if auth_token %}<meta name="hm-auth-token" content="{{ auth_token }}">{% endif %}
<meta name="hm-optimistic-stale-seconds" content="{{ optimistic_stale_seconds | default(5) }}">
<script>
  // v3.0.0a6: bearer-token plumbing for SSE / API fetches.
  // When the page is rendered with auth_token (bearer-protected install),
  // hmFetch() injects `Authorization: Bearer <token>` on every same-origin
  // request the dashboard makes — otherwise behaves like plain fetch().
  window.hmFetch = function (url, init) {
    const meta = document.querySelector('meta[name="hm-auth-token"]');
    const token = meta ? meta.getAttribute("content") : "";
    if (!token) return fetch(url, init);
    const opts = init ? { ...init } : {};
    const headers = new Headers(opts.headers || {});
    if (!headers.has("Authorization")) headers.set("Authorization", "Bearer " + token);
    opts.headers = headers;
    return fetch(url, opts);
  };
</script>
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<!-- v8.0.0a7: HTMX dropped. The dashboard switched to Alpine + SSE
     in v3.0; v8.0.0a1's audit confirmed zero `hx-*` attributes
     remained anywhere in the templates, so the script tag was
     pure download cost. Removing it shaves ~14KB off page weight. -->
<script defer src="https://unpkg.com/alpinejs@3"></script>
<!-- v2.1.0a1: project-graph render. ESM build of mermaid 10.9.1 so the
     dashboard can render `/api/graph["mermaid"]` markup on demand
     instead of dumping raw text on the user. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: false,
    theme: "dark",
    themeVariables: { darkMode: true },
    securityLevel: "loose",
  });
  window.__hmMermaid = mermaid;
</script>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

  /* v8.0.0a7: semantic color tokens via CSS custom properties.
     Defined in OKLCH so the eventual Tailwind v4 `@theme` migration
     (deferred to v9 to avoid the ops-cost decision of vendoring
     the v4 CLI) can lift these tokens directly into the `@theme`
     block without re-deriving values.

     Tokens are namespaced `--hm-*` so they don't collide with
     anything Tailwind CDN injects. New components should reference
     these via `var(--hm-*)` so a future palette change is one-edit.

     Color-vision-friendly contrast verified: every accent against
     surface-1 (gray-950) sits above WCAG AA (4.5:1). */
  :root {
    /* Surfaces — graduated grays, darkest = canvas */
    --hm-surface-1: oklch(0.20 0 0);    /* matches bg-gray-950 */
    --hm-surface-2: oklch(0.26 0 0);    /* matches bg-gray-900 */
    --hm-surface-3: oklch(0.32 0 0);    /* matches bg-gray-800 */

    /* Foreground — text & icons */
    --hm-foreground:        oklch(0.96 0 0);   /* near-white body text */
    --hm-foreground-muted:  oklch(0.74 0 0);   /* gray-400 equivalent */
    --hm-foreground-subtle: oklch(0.60 0 0);   /* gray-500 equivalent */

    /* Accent — cyan family (primary action color) */
    --hm-accent:        oklch(0.78 0.13 215); /* cyan-400 */
    --hm-accent-strong: oklch(0.62 0.15 220); /* cyan-600 */
    --hm-accent-soft:   oklch(0.32 0.06 220); /* cyan-900/50 */

    /* Semantic state colors */
    --hm-success: oklch(0.74 0.15 162); /* emerald-400 */
    --hm-warning: oklch(0.80 0.16 80);  /* amber-400 */
    --hm-danger:  oklch(0.66 0.20 25);  /* rose-400 */
    --hm-info:    oklch(0.78 0.13 215); /* cyan-400, alias of accent */

    /* Border tokens */
    --hm-border:        oklch(0.32 0 0);
    --hm-border-strong: oklch(0.42 0 0);

    /* Focus ring — accent at higher chroma so it punches through
       any background. Used by .focus-visible:ring-* utilities. */
    --hm-ring: oklch(0.85 0.16 215);
  }

  /* x-cloak guarantees Alpine-managed elements don't flash unstyled
     before Alpine boots. Centralized here so every template benefits. */
  [x-cloak] { display: none !important; }
</style>
</head>
<body class="min-h-screen">
<header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
  <div class="flex items-baseline gap-3">
    <!-- v8.0.0a6: hamburger toggle for the sidebar (mobile only). -->
    <button type="button"
            x-data
            @click="$dispatch('hm:sidebar:toggle')"
            aria-label="Toggle navigation sidebar"
            class="md:hidden text-gray-300 hover:text-cyan-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-950 px-1">
      <span aria-hidden="true">☰</span>
    </button>
    <span class="text-2xl" aria-hidden="true">⚓</span>
    <h1 class="text-xl font-bold">Harbormaster</h1>
    <span class="text-gray-500 text-sm">v{{ version }}</span>
  </div>
  <nav class="flex gap-4 text-sm">
    <a href="/" class="text-gray-300 hover:text-cyan-400">Dashboard</a>
    <a href="/tools/fan-out" class="text-gray-300 hover:text-cyan-400">Fan-out</a>
    <a href="/api/projects" class="text-gray-300 hover:text-cyan-400">/api/projects</a>
    <a href="/api/health" class="text-gray-300 hover:text-cyan-400">/api/health</a>
    <a href="https://github.com/FleetQ/harbormaster" class="text-gray-300 hover:text-cyan-400">GitHub</a>
  </nav>
</header>

<!-- v8.0.0a6: project navigation sidebar.
     Desktop: 240px fixed-left, always visible.
     Mobile: hidden by default, hamburger toggles. Backdrop closes.
     State (collapsed/expanded, pinned projects) persisted in
     localStorage so operator preference survives reloads. -->
<div x-data="projectSidebar()"
     x-init="init()"
     @hm:sidebar:toggle.window="mobileOpen = !mobileOpen"
     class="flex">
  <!-- Backdrop (mobile). Click closes. -->
  <div x-show="mobileOpen" x-cloak
       @click="mobileOpen = false"
       class="fixed inset-0 z-30 bg-gray-950/70 md:hidden"
       aria-hidden="true"></div>

  <!-- Sidebar rail. -->
  <aside :class="mobileOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'"
         class="fixed top-[57px] bottom-0 left-0 z-30 w-60 md:w-60 bg-gray-950 border-r border-gray-800 transform transition-transform overflow-y-auto"
         role="navigation"
         aria-label="Project navigation">
    <div class="p-3">
      <!-- Search-within-sidebar. -->
      <input type="text"
             x-model="filter"
             aria-label="Filter projects in sidebar"
             placeholder="Filter projects…"
             class="w-full bg-gray-900 border border-gray-800 rounded px-2 py-1 text-xs text-gray-200 placeholder-gray-500 focus:border-cyan-700 focus:outline-none mb-3">

      <!-- Pinned. -->
      <section x-show="visiblePinned().length > 0"
               data-sidebar-group="pinned"
               class="mb-3">
        <h3 class="text-[10px] uppercase tracking-wide text-gray-500 mb-1">Pinned</h3>
        <ul class="space-y-0.5">
          <template x-for="p in visiblePinned()" :key="'pin:' + p.name">
            <li>
              <a :href="`/projects/${encodeURIComponent(p.name)}`"
                 class="flex items-center gap-1.5 text-xs text-gray-300 hover:bg-gray-800/50 hover:text-cyan-300 px-2 py-1 rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-950">
                <span aria-hidden="true" class="text-amber-400">★</span>
                <span class="truncate" x-text="p.name"></span>
              </a>
            </li>
          </template>
        </ul>
      </section>

      <!-- Recently asked. -->
      <section x-show="visibleRecent().length > 0"
               data-sidebar-group="recent"
               class="mb-3">
        <h3 class="text-[10px] uppercase tracking-wide text-gray-500 mb-1">Recently asked</h3>
        <ul class="space-y-0.5">
          <template x-for="p in visibleRecent()" :key="'recent:' + p.name">
            <li>
              <a :href="`/projects/${encodeURIComponent(p.name)}`"
                 class="flex items-center gap-1.5 text-xs text-gray-300 hover:bg-gray-800/50 hover:text-cyan-300 px-2 py-1 rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-950">
                <span class="truncate" x-text="p.name"></span>
              </a>
            </li>
          </template>
        </ul>
      </section>

      <!-- By language. -->
      <section data-sidebar-group="by-language">
        <template x-for="lang in sortedLanguages()" :key="'lang:' + lang">
          <div class="mb-3">
            <button type="button"
                    @click="toggleLanguage(lang)"
                    :aria-expanded="!languageCollapsed[lang]"
                    :aria-label="`Toggle ${lang} group`"
                    class="text-[10px] uppercase tracking-wide text-gray-500 hover:text-gray-300 mb-1 flex items-center gap-1 w-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-950">
              <span aria-hidden="true" x-text="languageCollapsed[lang] ? '▸' : '▾'"></span>
              <span x-text="lang + ' (' + projectsByLanguage()[lang].length + ')'"></span>
            </button>
            <ul x-show="!languageCollapsed[lang]" class="space-y-0.5">
              <template x-for="p in visibleProjectsForLanguage(lang)" :key="lang + ':' + p.name">
                <li class="flex items-center group">
                  <a :href="`/projects/${encodeURIComponent(p.name)}`"
                     class="flex-1 text-xs text-gray-300 hover:bg-gray-800/50 hover:text-cyan-300 px-2 py-1 rounded truncate focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-950"
                     x-text="p.name"></a>
                  <button type="button" @click="togglePin(p.name)"
                          :aria-label="`${isPinned(p.name) ? 'Unpin' : 'Pin'} ${p.name}`"
                          :class="isPinned(p.name) ? 'text-amber-400' : 'text-gray-700 group-hover:text-gray-500'"
                          class="text-xs px-1 hover:text-amber-300 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-950">
                    <span aria-hidden="true">★</span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </section>

      <p x-show="loading" :aria-hidden="!loading" class="text-xs text-gray-400">loading…</p>
      <p x-show="error" :aria-hidden="!error" role="alert" aria-live="assertive" class="text-xs text-red-400" x-text="error"></p>
    </div>
  </aside>

  <!-- Main content area, offset for sidebar on desktop. -->
  <main class="flex-1 px-6 py-6 max-w-7xl mx-auto md:ml-60">
    {% block content %}{% endblock %}
  </main>
</div>

<script>
  // v8.0.0a6: project navigation sidebar Alpine scope.
  // Lazy-loads /api/projects, persists pinned + collapsed state in
  // localStorage. Recently-asked group reads /api/trajectories.
  function projectSidebar() {
    return {
      projects: [],
      recentProjects: [], // last-N project names from trajectories
      pinned: [], // localStorage-backed
      languageCollapsed: {}, // {python: false, ...}
      filter: '',
      mobileOpen: false,
      loading: true,
      error: '',

      async init() {
        this._loadPersisted();
        await Promise.all([this._loadProjects(), this._loadRecent()]);
      },

      _loadPersisted() {
        try {
          const raw = localStorage.getItem('hm:sidebar:pinned');
          this.pinned = raw ? JSON.parse(raw) : [];
        } catch (_) { this.pinned = []; }
        try {
          const raw = localStorage.getItem('hm:sidebar:lang-collapsed');
          this.languageCollapsed = raw ? JSON.parse(raw) : {};
        } catch (_) { this.languageCollapsed = {}; }
      },

      _persistPinned() {
        try { localStorage.setItem('hm:sidebar:pinned', JSON.stringify(this.pinned)); } catch (_) {}
      },

      _persistCollapsed() {
        try { localStorage.setItem('hm:sidebar:lang-collapsed', JSON.stringify(this.languageCollapsed)); } catch (_) {}
      },

      async _loadProjects() {
        try {
          const r = await hmFetch('/api/projects');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          // /api/projects returns a bare JSON list of project dicts
          // (see src/harbormaster/ui/routes.py).
          this.projects = await r.json();
        } catch (e) { this.error = e.message; }
        finally { this.loading = false; }
      },

      async _loadRecent() {
        try {
          const r = await hmFetch('/api/trajectories?limit=20');
          if (!r.ok) return;
          const data = await r.json();
          const seen = new Set();
          const names = [];
          for (const t of (data.trajectories || [])) {
            if (seen.has(t.project)) continue;
            seen.add(t.project);
            names.push(t.project);
            if (names.length >= 5) break;
          }
          this.recentProjects = names;
        } catch (_) { /* silent — sidebar still useful */ }
      },

      isPinned(name) { return this.pinned.includes(name); },

      togglePin(name) {
        if (this.isPinned(name)) {
          this.pinned = this.pinned.filter(n => n !== name);
        } else {
          this.pinned = [...this.pinned, name];
        }
        this._persistPinned();
      },

      toggleLanguage(lang) {
        this.languageCollapsed = {
          ...this.languageCollapsed,
          [lang]: !this.languageCollapsed[lang],
        };
        this._persistCollapsed();
      },

      _matchesFilter(p) {
        const q = (this.filter || '').trim().toLowerCase();
        if (!q) return true;
        return p.name.toLowerCase().includes(q);
      },

      visiblePinned() {
        return this.projects
          .filter(p => this.isPinned(p.name))
          .filter(p => this._matchesFilter(p));
      },

      visibleRecent() {
        const pinnedSet = new Set(this.pinned);
        return this.recentProjects
          .filter(name => !pinnedSet.has(name))
          .map(name => this.projects.find(p => p.name === name))
          .filter(p => p && this._matchesFilter(p));
      },

      projectsByLanguage() {
        const groups = {};
        const pinnedSet = new Set(this.pinned);
        for (const p of this.projects) {
          if (pinnedSet.has(p.name)) continue;
          const lang = p.language || 'unknown';
          (groups[lang] = groups[lang] || []).push(p);
        }
        return groups;
      },

      sortedLanguages() {
        const groups = this.projectsByLanguage();
        // Stable sort: known languages first (alphabetic), 'unknown' last.
        const keys = Object.keys(groups);
        const known = keys.filter(k => k !== 'unknown').sort();
        if (groups['unknown']) known.push('unknown');
        return known;
      },

      visibleProjectsForLanguage(lang) {
        return (this.projectsByLanguage()[lang] || []).filter(p => this._matchesFilter(p));
      },
    };
  }
</script>

<!-- v8.0.0a4: Cmd-K command palette. Global mount so every page
     can summon it. Lazy-loads /api/projects on first open so empty
     installs don't pay the network cost on page paint. -->
<div x-data="commandPalette()" x-init="bindKeyboard()" x-cloak>
  <div x-show="open" @click.self="close()"
       role="dialog" aria-modal="true" aria-label="Command palette"
       class="fixed inset-0 z-40 bg-gray-950/80 backdrop-blur-sm flex items-start justify-center pt-24"
       @keydown.escape.window="if (open) close()">
    <div class="w-full max-w-xl mx-4 bg-gray-900 border border-gray-700 rounded-lg shadow-2xl overflow-hidden"
         @click.stop>
      <header class="flex items-center gap-2 border-b border-gray-800 px-3 py-2">
        <span class="text-cyan-400" aria-hidden="true">⌘</span>
        <input x-ref="cmdkInput"
               type="text"
               x-model="query"
               @input="updateResults()"
               @keydown.arrow-down.prevent="moveSelection(1)"
               @keydown.arrow-up.prevent="moveSelection(-1)"
               @keydown.enter.prevent="activate()"
               aria-label="Search projects, tools, and shortcuts"
               placeholder="Type to search projects, tools, shortcuts…"
               class="flex-1 bg-transparent text-sm text-gray-100 placeholder-gray-500 focus:outline-none">
        <kbd class="bg-gray-800 border border-gray-700 rounded px-1.5 py-0.5 text-cyan-300 font-mono text-[10px]">Esc</kbd>
      </header>
      <ul x-show="results.length > 0"
          role="listbox"
          aria-label="Command palette results"
          class="max-h-[60vh] overflow-y-auto py-1">
        <template x-for="(r, i) in results" :key="r.kind + ':' + r.id">
          <li role="option"
              :aria-selected="i === selectedIndex"
              @mouseenter="selectedIndex = i"
              @click="activate()"
              :class="i === selectedIndex ? 'bg-cyan-900/40 text-cyan-100' : 'text-gray-200 hover:bg-gray-800/60'"
              class="px-3 py-1.5 text-sm flex items-center gap-2 cursor-pointer">
            <span class="text-[10px] uppercase tracking-wide text-gray-500 w-16 shrink-0"
                  x-text="r.category"></span>
            <span class="flex-1 truncate" x-text="r.label"></span>
            <span x-show="r.shortcut"
                  class="text-[10px] text-gray-500 font-mono shrink-0"
                  x-text="r.shortcut"></span>
          </li>
        </template>
      </ul>
      <div x-show="results.length === 0 && query"
           role="status"
           class="px-3 py-6 text-center text-xs text-gray-400">
        No results for <code class="text-cyan-400" x-text="query"></code>
      </div>
      <footer class="border-t border-gray-800 px-3 py-1.5 text-[10px] text-gray-500 flex justify-between">
        <span>
          <kbd class="bg-gray-800 border border-gray-700 rounded px-1 font-mono">↑↓</kbd>
          to navigate ·
          <kbd class="bg-gray-800 border border-gray-700 rounded px-1 font-mono">Enter</kbd>
          to select
        </span>
        <span x-text="`${results.length} result${results.length === 1 ? '' : 's'}`"></span>
      </footer>
    </div>
  </div>
</div>

<script>
  // v8.0.0a4: command palette Alpine scope.
  // Lazy projects fetch on first open; in-memory after that.
  // Bigram fuzzy match — small, no CDN dep, plenty good for ≤200
  // candidates (we top out at projects + tools, both small lists).
  function commandPalette() {
    return {
      open: false,
      query: '',
      projects: [],
      projectsLoaded: false,
      results: [],
      selectedIndex: 0,

      // Static catalog: tools + settings/help. Project entries are
      // appended dynamically once /api/projects has loaded.
      _tools: [
        { kind: 'tool', id: 'fan-out', category: 'Tool',
          label: 'Fan-out ask (multi-project query)',
          shortcut: '/tools/fan-out',
          href: '/tools/fan-out' },
        { kind: 'tool', id: 'recall', category: 'Tool',
          label: 'Recall Q&A history (semantic search)',
          shortcut: 'scroll to recall',
          action: () => document.querySelector('[x-data^="recallPanel"]')?.scrollIntoView({ behavior: 'smooth' }) },
        { kind: 'tool', id: 'graph', category: 'Tool',
          label: 'Project graph',
          shortcut: 'scroll to graph',
          action: () => document.querySelector('[x-data^="graphPanel"]')?.scrollIntoView({ behavior: 'smooth' }) },
        { kind: 'tool', id: 'reembed', category: 'Tool',
          label: 'Auto-reembed status',
          shortcut: 'scroll to reembed',
          action: () => document.querySelector('[x-data^="reembedPanel"]')?.scrollIntoView({ behavior: 'smooth' }) },
        { kind: 'tool', id: 'dashboard', category: 'Page',
          label: 'Dashboard',
          shortcut: '/',
          href: '/' },
        { kind: 'help', id: 'shortcuts', category: 'Help',
          label: 'Open keyboard shortcuts help',
          shortcut: '?',
          action: () => {
            // Mirror the helpPopover toggle.
            const evt = new KeyboardEvent('keydown', { key: '?', bubbles: true });
            window.dispatchEvent(evt);
          },
        },
      ],

      bindKeyboard() {
        window.addEventListener('keydown', (e) => {
          // Cmd+K (Mac) or Ctrl+K (everywhere else).
          if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
            e.preventDefault();
            this.toggle();
          }
        });
      },

      async toggle() {
        if (this.open) {
          this.close();
        } else {
          await this.openPalette();
        }
      },

      async openPalette() {
        this.open = true;
        this.query = '';
        this.selectedIndex = 0;
        await this._ensureProjects();
        this.updateResults();
        this.$nextTick(() => this.$refs.cmdkInput?.focus());
      },

      close() {
        this.open = false;
      },

      async _ensureProjects() {
        if (this.projectsLoaded) return;
        try {
          const r = await hmFetch('/api/projects');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          // /api/projects returns a bare list of project dicts.
          const list = await r.json();
          this.projects = list.map(p => ({
            kind: 'project',
            id: p.name,
            category: 'Project',
            label: p.name,
            shortcut: p.language || '',
            href: '/projects/' + encodeURIComponent(p.name),
          }));
          this.projectsLoaded = true;
        } catch (_) {
          // Network failure shouldn't break the palette — tools still work.
          this.projects = [];
          this.projectsLoaded = true;
        }
      },

      updateResults() {
        const q = (this.query || '').trim().toLowerCase();
        const all = this.projects.concat(this._tools);
        if (!q) {
          // Empty query: show top tools first, then the first 10 projects.
          const tools = this._tools.slice(0, 6);
          const projects = this.projects.slice(0, 10);
          this.results = tools.concat(projects);
        } else {
          this.results = all
            .map(item => ({ item, score: this._score(q, item.label.toLowerCase()) }))
            .filter(x => x.score > 0)
            .sort((a, b) => b.score - a.score)
            .slice(0, 20)
            .map(x => x.item);
        }
        this.selectedIndex = 0;
      },

      _score(q, candidate) {
        if (!q) return 0;
        // Fast exact-substring path: huge boost.
        if (candidate.includes(q)) {
          return 1000 - candidate.indexOf(q) - candidate.length * 0.1;
        }
        // Bigram overlap fallback.
        const qBigrams = this._bigrams(q);
        const cBigrams = this._bigrams(candidate);
        if (qBigrams.size === 0 || cBigrams.size === 0) return 0;
        let intersect = 0;
        for (const bg of qBigrams) if (cBigrams.has(bg)) intersect++;
        const score = intersect / qBigrams.size;
        return score > 0.4 ? score * 100 : 0;
      },

      _bigrams(s) {
        const out = new Set();
        for (let i = 0; i < s.length - 1; i++) out.add(s.slice(i, i + 2));
        return out;
      },

      moveSelection(delta) {
        if (this.results.length === 0) return;
        this.selectedIndex = (this.selectedIndex + delta + this.results.length) % this.results.length;
      },

      activate() {
        const r = this.results[this.selectedIndex];
        if (!r) return;
        this.close();
        // Wait one tick so the dialog backdrop closes before navigation,
        // otherwise the scroll-into-view happens against the backdrop.
        this.$nextTick(() => {
          if (r.href) {
            window.location.href = r.href;
          } else if (r.action) {
            r.action();
          }
        });
      },
    };
  }
</script>
