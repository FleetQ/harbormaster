# Security note: this workflow does NOT consume any untrusted github.event.*
# fields. Only tag-name and step-output expressions flow into run: blocks, all
# bound via env: for explicit handling. Uses PyPI Trusted Publishing (OIDC) —
# no long-lived API tokens stored in the repo.

name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [pypi, testpypi]
        default: pypi

permissions:
  contents: read

jobs:
  verify-ci:
    # v21.0.1: gate PyPI publish on the CI workflow having gone green
    # on this same commit. Prevents red-CI GAs from reaching PyPI like
    # every v9-v21 tag did during the autonomous chain.
    # Only enforced on tag-push; manual workflow_dispatch retains
    # operator discretion. All ${{ github.* }} expressions used here
    # come from trusted GitHub-controlled context (sha, repo metadata),
    # not user-supplied content, but they are still bound via env: per
    # GitHub Actions safe-pattern guidance.
    name: Verify CI succeeded on this commit
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI to finish + assert green
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          # v21.0.3: filter by event=push AND head_branch=main so we
          # cannot accidentally match a workflow_dispatch / pull_request
          # run on the same SHA. Defensive even though v21.0.3 ci.yml
          # also dropped the tag trigger that caused the original
          # ambiguity (two simultaneous CI runs on identical SHA).
          while true; do
            payload=$(gh api "repos/$OWNER/$REPO/actions/runs?head_sha=$SHA" \
              --jq '[.workflow_runs[]
                     | select(.name == "CI")
                     | select(.event == "push")
                     | select(.head_branch == "main")]
                    | sort_by(.created_at) | last // {}')
            status=$(printf '%s' "$payload" | jq -r '.status // ""')
            conclusion=$(printf '%s' "$payload" | jq -r '.conclusion // ""')
            id=$(printf '%s' "$payload" | jq -r '.id // ""')
            printf 'CI on %s: status=%s conclusion=%s id=%s\n' "$SHA" "$status" "$conclusion" "$id"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI green — proceeding."
                exit 0
              fi
              echo "::error::CI did not succeed on $SHA (conclusion=$conclusion). Refusing to publish."
              exit 1
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::Timed out waiting for CI on $SHA."
              exit 1
            fi
            sleep 20
          done

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Read package version
        id: version
        run: |
          v=$(uv run python -c "from harbormaster import __version__; print(__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building harbormaster-mcp $v"

      - name: Build distribution
        run: uv build

      - name: Verify built version matches tag
        if: github.event_name == 'push'
        env:
          REF: ${{ github.ref_name }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag_version="${REF#v}"
          if [ "$tag_version" != "$PKG_VERSION" ]; then
            echo "Tag $REF (-> $tag_version) does not match package $PKG_VERSION"
            exit 1
          fi
          echo "OK: tag $REF matches package version $PKG_VERSION"

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    # v21.0.1: gate on verify-ci (tag-push only); build is always required.
    needs: [build, verify-ci]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/harbormaster-mcp
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/harbormaster-mcp
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
