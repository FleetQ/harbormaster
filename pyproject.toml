[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbormaster-mcp"
dynamic = ["version"]
description = "MCP server that routes Q&A across all your projects — locally or over SSH. Part of the FleetQ ecosystem."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "FleetQ", email = "harbormaster@fleetq.net" },
]
keywords = ["mcp", "claude", "claude-code", "fleetq", "agent", "router", "ai", "subagent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "bleach>=6.1",
    "sse-starlette>=2.0",
]
fleetq = [
    "httpx>=0.27",
    # Pusher / Reverb client for the Bridge reverse-channel subscription
    # (private-daemon.<team_id> on FleetQ's Reverb server). Used by
    # harbormaster.fleetq.relay.BridgeRelay.
    "pysher>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-httpserver>=1.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "hypothesis>=6.100",
    # UI + fleetq extras pulled in for the test suite — keeps a single
    # `uv sync --extra dev` command working for contributors who don't want
    # to enumerate every optional extra.
    "fastapi>=0.110",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pysher>=1.0",
]

[project.scripts]
harbormaster-mcp = "harbormaster.__main__:main"
harbormaster-ui = "harbormaster.ui.cli:main"

[project.urls]
Homepage = "https://github.com/FleetQ/harbormaster"
Repository = "https://github.com/FleetQ/harbormaster"
Issues = "https://github.com/FleetQ/harbormaster/issues"
Documentation = "https://github.com/FleetQ/harbormaster/tree/main/docs"

[tool.hatch.version]
# Single source of truth for the package version. Hatchling reads __version__
# from this file at build time; runtime imports also read from the same place.
path = "src/harbormaster/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harbormaster"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # let formatter handle line length

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/harbormaster"]

[[tool.mypy.overrides]]
module = "pysher"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
