[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbormaster-mcp"
dynamic = ["version"]
description = "MCP server that routes Q&A across all your projects — locally or over SSH. Part of the FleetQ ecosystem."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "FleetQ", email = "harbormaster@fleetq.net" },
]
keywords = ["mcp", "claude", "claude-code", "fleetq", "agent", "router", "ai", "subagent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "bleach>=6.1",
    "sse-starlette>=2.0",
]
fleetq = [
    "httpx>=0.27",
    # Pusher / Reverb client for the Bridge reverse-channel subscription
    # (private-daemon.<team_id> on FleetQ's Reverb server). Used by
    # harbormaster.fleetq.relay.BridgeRelay.
    "pysher>=1.0",
]
history = [
    # sqlite-vec ships a SQLite extension and Python loader. Used by the
    # v1.2 Q&A history store for cosine-similarity recall over question
    # embeddings.
    "sqlite-vec>=0.1.6",
    # fastembed runs BAAI/bge-small-en-v1.5 locally (~50MB ONNX model,
    # downloaded on first encode call). Default embedding backend; the
    # store falls back to FTS5 / bm25 when the [history] extra is absent
    # or [history].embedding_backend is set to "fts5".
    "fastembed>=0.3",
    # Pin onnxruntime below 1.26.0 — that release shipped without the
    # cp312 macOS arm64 wheel (1.25.x and 1.26.x cp311/cp313 are fine).
    # This pin can be removed once onnxruntime 1.26.1+ restores the
    # missing wheel. Tracked upstream: https://github.com/microsoft/onnxruntime/issues
    "onnxruntime<1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-httpserver>=1.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "hypothesis>=6.100",
    # UI + fleetq + history extras pulled in for the test suite — keeps
    # a single `uv sync --extra dev` command working for contributors
    # who don't want to enumerate every optional extra.
    "fastapi>=0.110",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pysher>=1.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.3",
    "onnxruntime<1.26",
]
ui-test = [
    # v3.0.0a10: headless browser tests for the dashboard / fan-out /
    # project_detail flows. Browser tests opt-in via `-m browser`.
    # Operators install the chromium binary separately:
    #     uv run playwright install chromium
    "playwright>=1.45",
    "pytest-playwright>=0.5",
]

[project.scripts]
harbormaster-mcp = "harbormaster.__main__:main"
harbormaster-ui = "harbormaster.ui.cli:main"

[project.urls]
Homepage = "https://github.com/FleetQ/harbormaster"
Repository = "https://github.com/FleetQ/harbormaster"
Issues = "https://github.com/FleetQ/harbormaster/issues"
Documentation = "https://github.com/FleetQ/harbormaster/tree/main/docs"

[tool.hatch.version]
# Single source of truth for the package version. Hatchling reads __version__
# from this file at build time; runtime imports also read from the same place.
path = "src/harbormaster/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harbormaster"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # let formatter handle line length

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/harbormaster"]

[[tool.mypy.overrides]]
module = "pysher"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastembed"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
# v3.0.0a10: opt-in markers. Browser tests are skipped unless `-m browser`
# is passed; CI's smoke-ui-browser job runs them after installing the
# Playwright browser binaries.
markers = [
    "browser: requires Playwright + chromium (gate with -m browser)",
]
